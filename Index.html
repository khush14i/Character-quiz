<style>

  --pop:#ffd23f;
  --hot:#ff3d81;
  --cool:#2ee6d6;
  --soft:#cfc9f5;

}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{

}

}

.quiz{display:grid;gap:16px}

.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--band);color:var(--paper);border-radius:999px;padding:4px 12px;font:800 .76rem var(--body);letter-spacing:.08em;text-transform:uppercase}
.pill.hl{background:var(--ac);color:var(--hlT);border:2px solid var(--ink);padding:2px 12px}
.bubble{position:relative;margin-top:12px;width:100%;background:var(--paper);color:var(--ink);border:4px solid var(--edge);border-radius:16px;padding:12px 16px;font:800 1.08rem/1.3 var(--body)}
.bubble::before{content:"";position:absolute;top:-19px;left:28px;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:15px solid var(--edge)}
.bubble::after{content:"";position:absolute;top:-10px;left:33px;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--paper)}
.who{display:block;margin-top:4px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7}

.e-burst path{fill:var(--burst);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}

.e-disc{fill:var(--disc);stroke:var(--rim);stroke-width:6}
.e-icon path{fill:var(--icon);stroke:var(--rim);stroke-width:3;stroke-linejoin:round;fill-rule:evenodd}
.e-q{font-family:var(--display);font-size:104px;fill:var(--paper);stroke:var(--hot);stroke-width:4;paint-order:stroke fill;text-anchor:middle}

.e-burst{transform-box:view-box;transform-origin:50% 50%;animation:spin 26s linear infinite}
.e-ring{transform-box:view-box;transform-origin:50% 50%;animation:spin 18s linear infinite reverse}
.e-icon,.e-sp{transform-box:fill-box;transform-origin:50% 50%}
.e-icon{animation:beat 1.8s ease-in-out infinite}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

/* ---------- scoring ---------- */
const tally = ans => { const s = [0, 0, 0]; ans.forEach((k, i) => { const v = Q[i].options[k].v; for (let a = 0; a < 3; a++) s[a] += v[a]; }); return s; };
/* Matching: each character sits at a direction in trait space (plus a small balancing bias). The answer scores are scaled per trait, turned into a direction, and the closest character wins. Exact ties are settled by a fixed shuffle of the answers, so the same answers always give the same result. */
const rank = (s, ans = []) => {
  const n = s.map((x, a) => x / MAXABS[a]), m = Math.hypot(n[0], n[1], n[2]);
  const u = m > 1e-9 ? n.map(x => x / m) : [0, 0, 0];
  const h = ans.reduce((t, k, i) => t * 3 + k + i, 0);
  return CH.map((c, i) => ({c, i, d: -(u[0] * c.at[0] + u[1] * c.at[1] + u[2] * c.at[2] + c.bias), t: (i * 5 + h) % 12}))
    .sort((a, b) => Math.abs(a.d - b.d) > 1e-9 ? a.d - b.d : a.t - b.t);
};

const state = {i: 0, answers: [], lock: false, cur: null, png: null};

  $('#qnum').textContent = `Question ${state.i + 1} of ${Q.length}`;
  $('#qtext').textContent = q.text;

  q.options.forEach((o, k) => {
    const b = document.createElement('button');

    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = 'ABC'[k];
    const t = document.createElement('span'); t.textContent = o.t;

    b.addEventListener('click', () => pick(k, b));
    box.append(b);
  });

function pick(k, b) {

  state.lock = true; b.classList.add('chosen'); state.answers[state.i] = k;
  setTimeout(() => {

    const sp = w.querySelectorAll('.lbl span'); sp[0].textContent = ax[0]; sp[1].textContent = ax[1];
    w.querySelector('b').style.left = pct[a] + '%';
    return w;
  }));
  const near = r.slice(1, 3).map(x => x.c.name);
  const nr = $('#rnear'); nr.replaceChildren('Also close to ');
  near.forEach((n, i) => { const b = document.createElement('b'); b.textContent = n; nr.append(b, i < near.length - 1 ? ' and ' : '.'); });
  $('#cap').value = `I got ${ch.name}, ${ch.arch}! Which character are you? ${CCI_HANDLE ? '@' + CCI_HANDLE + ' ' : 'Tag the CCI page and a friend to compare. '}#ComicConHyderabad2026`;
  setFoot(FOOT.length - 1);
  show('result');
  paintBg();
  renderImage();
  $('#rname').focus({preventScroll: true});
}
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => { if (!$('#result').hidden) paintBg(); }).observe($('#card'));

function reset() { state.i = 0; state.answers = []; state.lock = false; show('quiz'); renderQ(); $('#qtext').focus({preventScroll: true}); }

/* ---------- toast, copy, save ---------- */
let tt;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }
async function copyCap() {
  const t = $('#cap');
  try { await navigator.clipboard.writeText(t.value); toast('Caption copied'); return; } catch (e) {}
  // some views refuse the clipboard API; the older copy command still works from a tap
  try {
    t.removeAttribute('readonly'); t.focus(); t.select(); t.setSelectionRange(0, t.value.length);
    const ok = document.execCommand('copy'); t.setAttribute('readonly', '');
    if (ok) { toast('Caption copied'); return; }
  } catch (e) { t.setAttribute('readonly', ''); }
  t.focus(); t.select(); toast('Caption selected. Press Ctrl+C, or tap and hold, to copy it.');
}

/* Downloads: inside Claude's viewer only the downloads capability can save a file. On an ordinary website a normal download link works.
   Anywhere else the Download button stays hidden and the card image is shown to press and hold. */
const FRAMED = (() => { try { return window.top !== window; } catch (e) { return true; } })();
let DL = null, canDL = !FRAMED;
function syncSave() { $('#save').hidden = !(canDL && state.png); }
async function initDL() {
  try { if (window.claude && window.claude.use) DL = await window.claude.use('downloads'); } catch (e) { DL = null; }
  canDL = !!DL || !FRAMED;
  syncSave();
}

let imgToken = 0;
async function renderImage() {
  const tok = ++imgToken, cur = state.cur;
  state.png = null; syncSave(); $('#pngbox').hidden = true; $('#pngimg').removeAttribute('src');
  try {
    const cv = await cardCanvas(cur.ch, cur.pct);
    const blob = await new Promise((res, rej) => cv.toBlob(x => x ? res(x) : rej(new Error('blob')), 'image/png'));
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
    if (tok !== imgToken) return;
    state.png = {blob, url, id: cur.ch.id};
    $('#pngimg').src = url; $('#pngbox').hidden = false; syncSave();
  } catch (e) { /* the on-screen card still works without the image */ }
}

function roundRect(x, X, Y, W, H, r) { x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
function wrapText(x, text, maxW) { const words = text.split(' '), lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } lines.push(cur); return lines; }

async function cardCanvas(ch, pct) {
  const t = THEMES[ch.id];
  try { await Promise.race([Promise.all([document.fonts.load(`${t.fw} 96px "${t.font}"`), document.fonts.load('800 32px Nunito')]), new Promise(r => setTimeout(r, 1500))]); } catch (e) {}
  const W = 1080, H = 1350, P = 36, FB = "Nunito, system-ui, sans-serif";
  const FD = s => `${t.fw} ${s}px "${t.font}", Impact, 'Arial Black', sans-serif`;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = t.edge; x.fillRect(0, 0, W, H);
  const g = x.createLinearGradient(W * .35, P, W * .65, H - P); g.addColorStop(0, t.bg1); g.addColorStop(1, t.bg2);
  x.fillStyle = g; x.fillRect(P, P, W - 2 * P, H - 2 * P);
  x.save(); x.beginPath(); x.rect(P, P, W - 2 * P, H - 2 * P); x.clip(); opsCanvas(x, patOps(t, W, H, CH.indexOf(ch) + 1)); x.restore();

  // emblem (same shapes as the animated one on screen, 2.45x)
  const cx = 540, cy = 380;
  x.lineJoin = 'round'; x.lineCap = 'round';
  const burst = new Path2D(poly(starPts(cx, cy, 240, t.br * 2.45, t.bn)));
  x.fillStyle = t.burst; x.strokeStyle = t.ink; x.lineWidth = 6; x.fill(burst); x.stroke(burst);
  x.strokeStyle = t.edge; x.lineWidth = 8; x.setLineDash([6, 26]);
  x.beginPath(); x.arc(cx, cy, 196, 0, 6.2832); x.stroke(); x.setLineDash([]);
  x.fillStyle = t.disc; x.strokeStyle = t.rim; x.lineWidth = 12;
  x.beginPath(); x.arc(cx, cy, 147, 0, 6.2832); x.fill(); x.stroke();
  x.save(); x.translate(cx - 112, cy - 112); x.scale(2.24, 2.24);
  const ic = new Path2D(ICONS[ch.icon]);
  x.fillStyle = t.icon; x.strokeStyle = t.rim; x.lineWidth = 2.6; x.fill(ic, 'evenodd'); x.stroke(ic);
  x.restore();
  x.save(); x.translate(cx - 245, cy - 245); x.scale(2.45, 2.45);
  SPARKS.forEach(d => { const p = new Path2D(d); x.fillStyle = t.paper; x.strokeStyle = t.ink; x.lineWidth = 2; x.fill(p); x.stroke(p); });
  x.restore();

  // top band
  x.fillStyle = t.band; x.fillRect(P, P, W - 2 * P, 96);
  const L = 'COMIC CON HYDERABAD 2026', Rr = '11 TO 13 DEC';
  let fs = 46; x.font = FD(fs);
  while (x.measureText(L).width + x.measureText(Rr).width + 90 > W - 2 * P - 68 && fs > 22) { fs -= 2; x.font = FD(fs); }
  x.fillStyle = t.bandA; x.textBaseline = 'alphabetic';
  x.textAlign = 'left'; x.fillText(L, P + 34, P + 62);
  x.textAlign = 'right'; x.fillText(Rr, W - P - 34, P + 62);

  // name
  x.textAlign = 'center';
  x.fillStyle = t.fg; x.font = `800 32px ${FB}`;
  if ('letterSpacing' in x) x.letterSpacing = '8px';
  x.fillText('YOU ARE', cx, 676);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
  const nm = ch.name.toUpperCase();
  let size = 118; x.font = FD(size);
  while (x.measureText(nm).width > 880 && size > 56) { size -= 4; x.font = FD(size); }
  x.lineJoin = 'round'; x.lineWidth = 16;
  x.strokeStyle = t.shadow; x.strokeText(nm, cx + 6, 776 + 6);
  x.strokeStyle = t.ink; x.strokeText(nm, cx, 776);
  x.fillStyle = t.paper; x.fillText(nm, cx, 776);

  // pills
  x.font = `800 28px ${FB}`;
  const gt = ch.genre.toUpperCase(), at = ch.arch.toUpperCase();
  const gw = x.measureText(gt).width + 44, aw = x.measureText(at).width + 44, gap = 16;
  let px = cx - (gw + aw + gap) / 2; const py = 808;
  roundRect(x, px, py, gw, 52, 26); x.fillStyle = t.ac; x.fill(); x.lineWidth = 4; x.strokeStyle = t.ink; x.stroke();
  x.fillStyle = hlText(t); x.textAlign = 'center'; x.fillText(gt, px + gw / 2, py + 36);
  px += gw + gap;
  roundRect(x, px, py, aw, 52, 26); x.fillStyle = t.band; x.fill();
  x.fillStyle = t.paper; x.fillText(at, px + aw / 2, py + 36);

  // speech bubble
  const bx = 110, by = 896, bw = 860, bh = 164;
  roundRect(x, bx, by, bw, bh, 30); x.fillStyle = t.paper; x.fill(); x.lineWidth = 8; x.strokeStyle = t.edge; x.stroke();
  x.beginPath(); x.moveTo(168, by); x.lineTo(206, by - 36); x.lineTo(246, by); x.closePath(); x.fillStyle = t.paper; x.fill(); x.stroke();
  x.beginPath(); x.moveTo(176, by); x.lineTo(238, by); x.lineWidth = 12; x.strokeStyle = t.paper; x.stroke();
  x.fillStyle = t.ink; x.textAlign = 'center';
  let qs = 44, lines; x.font = `800 ${qs}px ${FB}`; lines = wrapText(x, '“' + ch.quote + '”', 780);
  if (lines.length > 2) { qs = 36; x.font = `800 ${qs}px ${FB}`; lines = wrapText(x, '“' + ch.quote + '”', 780); }
  const lh = qs + 10; let ty = by + 62 - (lines.length - 1) * (lh / 2 - 4);
  lines.forEach(l => { x.fillText(l, cx, ty); ty += lh; });
  x.globalAlpha = .7; x.font = `800 24px ${FB}`;
  if ('letterSpacing' in x) x.letterSpacing = '3px';
  x.fillText('— ' + ch.name.toUpperCase(), cx, by + bh - 18);
  if ('letterSpacing' in x) x.letterSpacing = '0px';
  x.globalAlpha = 1;

  // traits
  AXES.forEach((ax, i) => {
    const y0 = 1086 + i * 46, Lx = 100, Rx = W - 100, w = Rx - Lx;
    x.fillStyle = t.fg; x.font = `800 21px ${FB}`;
    x.textAlign = 'left'; x.fillText(ax[0].toUpperCase(), Lx, y0 + 18);
    x.textAlign = 'right'; x.fillText(ax[1].toUpperCase(), Rx, y0 + 18);
    roundRect(x, Lx, y0 + 26, w, 14, 7); x.fillStyle = t.paper; x.fill(); x.lineWidth = 4; x.strokeStyle = t.edge; x.stroke();
    const mx = Lx + w * pct[i] / 100;
    roundRect(x, mx - 8, y0 + 18, 16, 30, 4); x.fillStyle = t.ink; x.fill(); x.lineWidth = 3; x.strokeStyle = t.paper; x.stroke();
  });

  // footer band
  x.fillStyle = t.band; x.fillRect(P, H - P - 84, W - 2 * P, 84);
  x.fillStyle = t.bandA; x.font = FD(46); x.textAlign = 'left'; x.fillText('CCI OFFICE', P + 34, H - P - 26);
  x.fillStyle = t.paper; x.font = `800 26px ${FB}`; x.textAlign = 'right'; x.fillText('#ComicConHyderabad2026', W - P - 34, H - P - 28);
  return c;
}

async function saveCard() {
  const p = state.png; if (!p) return;
  const name = `comic-con-hyderabad-2026-${p.id}.png`;
  if (DL) {
    try { await DL.save({filename: name, data: p.blob}); toast('Card saved'); }
    catch (e) { if (!e || e.code !== 'declined') toast('Could not save. Press and hold the image instead.'); }
    return;
  }
  const url = URL.createObjectURL(p.blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Downloading your card');
}

/* ---------- wiring ---------- */
$('#mystery').innerHTML = emblem(null);
setFoot(0);
initDL();
$('#start').addEventListener('click', reset);
$('#back').addEventListener('click', () => { if (state.i > 0) { state.i--; renderQ(); } });
$('#again').addEventListener('click', reset);
$('#copy').addEventListener('click', copyCap);
$('#save').addEventListener('click', saveCard);
})();
</script>
